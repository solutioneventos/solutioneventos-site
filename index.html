<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution Eventos</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #000;
    padding: 30px;
    text-align: center;
}

header h1 {
    color: #d4af37;
    font-size: 40px;
}

section {
    padding: 40px;
    text-align: center;
}

.card {
    background: #222;
    margin: 20px auto;
    padding: 25px;
    max-width: 700px;
    border-radius: 10px;
}

button {
    background: #d4af37;
    border: none;
    padding: 15px 25px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
}

footer {
    background: #000;
    padding: 20px;
    text-align: center;
    color: #aaa;
}
</style>

</head>

<body>

<header>
<h1>Solution Eventos</h1>
<p>Transformando momentos em experiências inesquecíveis</p>
</header>

<section>

<div class="card">
<h2>Eventos Sociais</h2>
<p>Casamentos, aniversários e celebrações especiais.</p>
</div>

<div class="card">
<h2>Eventos Corporativos</h2>
<p>Estrutura completa para empresas e grandes encontros.</p>
</div>

<div class="card">
<h2>Entre em contato</h2>
<p>Solicite seu orçamento.</p>
<button>Contato</button>
</div>

</section>

<footer>
© 2026 Solution Eventos
</footer>

</body>
</html>
